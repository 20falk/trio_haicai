<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAICAI TRIO - Em Construção</title>
    <!-- Biblioteca de Ícones Estável -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* Configurações Gerais - Fundo Preto Absoluto */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #000000; /* Fundo Preto Absoluto pedido */
            color: #d1d1d1;
            line-height: 1.6;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            width: 100%;
        }

        /* Caixa Centralizada de Conteúdo */
        .content-card {
            background-color: #121214; /* Grafite escuro para destacar do fundo preto */
            border: 1px solid #2d2d30;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        /* Botão Voltar Compacto */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #8c8c8c;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            transition: color 0.2s ease;
        }
        .back-link:hover {
            color: #4cd9ef; /* Transição para o azul ciano */
        }

        /* Tarja / Bloco de Aviso */
        .top-stripe {
            background-color: #1c1c1e;
            border: 1px solid #2d2d30;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
        }
        .top-stripe h3 {
            color: #e5c158; /* Dourado Ouro para o aviso */
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 900;
        }
        .top-stripe p {
            font-size: 1rem;
            color: #a3a3a3;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Caixa com todo o conteúdo interno -->
    <div class="content-card">

        <!-- Botão de Voltar Configurado -->
        <a href="../index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao Início
        </a>

        <!-- Bloco de Aviso Centralizado -->
        <div class="top-stripe">
            <h3>EM CONSTRUÇÃO!!!</h3>
            <p>Em breve, novidades e registros dos nossos concertos estarão disponíveis nesta página.</p>
        </div>

    </div>

</div>

</body>
</html>
